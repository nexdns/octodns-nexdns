name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Check metadata renders on PyPI
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI mints a short-lived token from this workflow's
      # OIDC identity, so no long-lived API token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # A release tag can be re-pushed - to correct commit metadata, or to
      # recover a run that failed after the upload. PyPI refuses a second
      # upload of a version that already exists, which would fail the job
      # for a file it already has; treat that as the no-op it is.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
