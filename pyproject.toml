[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octodns-nexdns"
version = "1.0.0"
description = "NexDNS DNS provider for OctoDNS"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "octodns>=1.5.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://nexdns.tech"
Repository = "https://github.com/nexdns/octodns-nexdns"
